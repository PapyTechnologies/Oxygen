name: Bug Report
description: File a bug report to help improve Oxygen Browser
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please ensure that you are using the latest version of Oxygen and that no sensitive credentials (API tokens, stream keys) are included in this report.
  - type: input
    id: version
    attributes:
      label: Oxygen Version
      description: What version of Oxygen are you running? (e.g., v0.1.0 or commit SHA)
      placeholder: "v0.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Windows Operating System Version
      options:
        - Windows 11 (64-bit)
        - Windows 10 (64-bit, 22H2 or newer)
        - Other Windows build
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this behavior?
      placeholder: |
        1. Open Oxygen
        2. Navigate to '...'
        3. Click on '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Diagnostic Logs / Terminal Output
      description: Paste any terminal output or relevant error logs here (redact all personal paths and keys!).
      render: shell

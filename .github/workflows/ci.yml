name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-and-test:
    name: Build, Lint & Test (Windows)
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Move Cargo target dir outside the project tree
        shell: pwsh
        run: echo "CARGO_TARGET_DIR=$env:RUNNER_TEMP\cargo-target" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Cache Cargo dependencies & build outputs
        uses: Swatinem/rust-cache@v2

      - name: Code formatting check (rustfmt)
        run: cargo fmt --all -- --check

      - name: Linting (clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace automated tests
        run: cargo test --workspace --no-fail-fast

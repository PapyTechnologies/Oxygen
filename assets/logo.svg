<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <linearGradient id="oxy-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ecff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#8d24ff"/>
    </linearGradient>
    <linearGradient id="oxy-grad-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ecff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8"/>
    </linearGradient>
    <radialGradient id="bg-glow" cx="120" cy="120" r="110">
      <stop offset="0%" stop-color="#00ecff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#8d24ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="120" cy="120" r="100" fill="url(#bg-glow)"/>

  <!-- Icon Section (Scaled & Centered around (120, 120)) -->
  <g transform="translate(24, 24) scale(0.375)">
    <!-- Orbital Outer Arc -->
    <circle cx="256" cy="256" r="180" fill="none" stroke="url(#oxy-grad-glow)" stroke-width="8" stroke-dasharray="380 180" stroke-linecap="round" transform="rotate(-45 256 256)" opacity="0.6"/>

    <!-- Main Oxygen Ring -->
    <g filter="url(#neon-glow)">
      <path d="M 256,76 
               A 180,180 0 1,1 128,128 
               L 168,168 
               A 124,124 0 1,0 256,132 
               Z" 
            fill="url(#oxy-grad-primary)"/>
    </g>

    <!-- Dynamic Energy Swirl -->
    <path d="M 256,100 C 342,100 412,170 412,256 C 412,342 342,412 256,412 C 190,412 134,370 112,312 C 124,316 138,318 152,318 C 220,318 276,262 276,194 C 276,156 258,122 232,102 C 240,101 248,100 256,100 Z" 
          fill="url(#oxy-grad-primary)" opacity="0.95"/>

    <!-- Core Orbital Nucleus -->
    <circle cx="256" cy="256" r="48" fill="url(#oxy-grad-primary)"/>
    <circle cx="256" cy="256" r="28" fill="#ffffff" opacity="0.95"/>
    <circle cx="256" cy="256" r="16" fill="#00ecff"/>
  </g>

  <!-- Typography Section -->
  <g transform="translate(260, 138)">
    <text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
          font-size="82" 
          font-weight="900" 
          letter-spacing="10" 
          fill="url(#oxy-grad-primary)">OXYGEN</text>
  </g>

  <g transform="translate(265, 185)">
    <text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
          font-size="20" 
          font-weight="600" 
          letter-spacing="6" 
          fill="#94a3b8">ULTRA-LIGHTWEIGHT AI BROWSER</text>
  </g>
</svg>
